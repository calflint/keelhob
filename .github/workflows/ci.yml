name: CI

on:
  push:
    # EVERY branch. Not a list of prefixes.
    #
    # This was a list, and it kept being wrong. First it was [main, dev,
    # 'feature/**'] and a branch named fix/rig-silent-failures got NO CI AT
    # ALL. Twelve more prefixes were added. Then a branch named
    # rebrand/keelhob -- carrying a whole-project rename -- was pushed and got
    # nothing, again.
    #
    # The failure is silent, and that is what makes it bad. GitHub does not
    # skip the run or warn about it; it simply has nothing to run, and the
    # branch page shows no check marks rather than a red one. Silence reads
    # exactly like "nothing to report", which is the one thing it does not
    # mean.
    #
    # A list of prefixes can only ever be as good as the last person's guess at
    # what people will name branches. '**' cannot be wrong.
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

# What the CI token may do, stated here rather than inherited.
#
# The repository default is already read-only, so this changes nothing today.
# It is written down because a repository SETTING is invisible from the code:
# anyone who flips that default to read/write silently hands eight jobs the
# ability to push to this repository, and those jobs run code from strangers'
# pull requests. A line in the file cannot be widened by a click in a menu.
#
# contents: read is enough for every job here. The two GITHUB_TOKEN uses are
# setup-php resolving pinned tools through the API, and upload-artifact uses
# the Actions runtime token rather than this one. Nothing publishes, comments
# or pushes.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the plugin's declared floor; the rest are what real hosts run.
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax-check every PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::PHP syntax error"
              php -l "$file" || true
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $fail

  test:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Run the test suite
        run: php tests/run.php

  skills:
    name: Skill standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      # The rubric a contributed skill is accepted against. It runs here so the
      # answer to "is this skill good enough" is the same for a maintainer, a
      # contributor and CI, instead of three different judgements.
      - name: Check every skill against the standard
        run: php bin/lint-skills.php

      # The catalogue, the contributor doc and the skill-tree table are all
      # generated from skills/*.md. This fails when they are stale, which is the
      # whole reason accepting a skill no longer costs four hand edits in four
      # unrelated files.
      - name: Check the generated files are current
        run: php bin/build-skill-router.php --check

      - name: Contents lists are generated, not hand-kept
        run: php bin/build-skill-contents.php --check

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PHPStan only has to RUN here. It ANALYSES as PHP 8.0 — the plugin's
      # declared floor — because phpstan.neon pins phpVersion: 80000. So this
      # job deliberately does not repeat the version matrix above.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Dev tooling only. The plugin itself has no runtime dependencies and no
      # vendor/ ever reaches the shipped zip — see bin/build-zip.sh.
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan
        run: composer analyse

  rig:
    name: Live rig
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # ONE PHP version, on purpose. This job asks whether the plugin is right
      # IN SITU - against a real $wpdb, real hooks, real option autoloading -
      # not whether it runs on five interpreters; `lint` and `test` above
      # already answer that, on 8.0 through 8.4. A matrix here would download
      # WordPress five times to re-answer a question nobody asked.
      #
      # 8.3 because the Static analysis job already standardises on it, because
      # it is inside WordPress's own supported range, and because it is quiet:
      # WordPress core and WP-CLI both still emit deprecation noise on 8.4+,
      # and run-all.sh filters those lines rather than reading them.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, sodium, openssl
          coverage: none
          tools: wp-cli:2.12.0
        env:
          # setup-php resolves pinned tools through the GitHub API. Without a
          # token that is an anonymous, rate-limited call, and a rate limit
          # would look exactly like a broken rig.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # WordPress and the SQLite integration are pinned inside build-rig.sh, so
      # this key only moves when someone deliberately bumps a version there.
      # Without it every push re-downloads ~37MB of WordPress.
      - name: Cache the rig downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/keelhob-rig
          key: rig-downloads-${{ hashFiles('tests/rig/build-rig.sh') }}
          restore-keys: rig-downloads-

      # Builds a throwaway WordPress on SQLite and copies the plugin in. Copies
      # rather than symlinks: PHP resolves symlinks in __FILE__, which would put
      # KEELHOB_DIR outside wp-content/plugins and make the rig test a shape
      # no real install has. build-rig.sh explains it at more length.
      - name: Build the rig
        run: KH_RIG_CACHE="$HOME/.cache/keelhob-rig" bash tests/rig/build-rig.sh "$RUNNER_TEMP/rig"

      - name: Run the live checks
        run: |
          set -euo pipefail
          bash tests/rig/run-all.sh "$RUNNER_TEMP/rig/wordpress" | tee rig.log
          # run-all.sh already exits non-zero when a check fails, and that is
          # the gate. These two lines cover the other way a rig job goes wrong:
          # the checks never run at all - a path that moved, an eval-file that
          # loaded nothing - and the job goes green having verified nothing,
          # which is worse than having no job at all. The number is a tripwire
          # for "did anything run", not an exact count to keep updated.
          passes=$(grep -c '^PASS' rig.log || true)
          if [ "$passes" -lt 100 ]; then
            echo "::error::only $passes PASS lines in the rig output - the checks did not really run"
            exit 1
          fi
          # The COUNT is deliberately not pinned here. It was 'All 3 check
          # files passed.', and adding a fourth check file turned a run where
          # every single assertion passed into a red build. That is the same
          # hand-kept-counter trap as EXPECTED_SKILLS; the tripwire only needs
          # to prove the runner reached its success line.
          grep -qE 'All [0-9]+ check files passed\.' rig.log
          echo "Live rig: $passes checks passed against real WordPress."

      # The rig needs no secrets: tests/rig/ai-mock.php replaces the provider
      # network hop, so the whole agent loop runs for real with no API key and
      # no spend. If that ever stops being true, the check that needs a key must
      # skip loudly rather than fail - a rig nobody can run is a rig nobody runs.
      - name: Upload the rig log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rig-log
          path: rig.log
          if-no-files-found: warn

  browser:
    name: Browser checks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ADVISORY, NOT A GATE - for now.
    #
    # A browser layer is flaky before it is trustworthy, and a flaky gate on a
    # one-person project blocks the one person. So this reports and does not
    # block.
    #
    # THE FLAG COMES OFF once this job has been green for seven consecutive days
    # on main. Write that date into the PR that removes it, or this line quietly
    # becomes permanent and the checks stop meaning anything.
    #
    # The PHP rig job above stays blocking. This is a new layer, not a
    # replacement for one.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, sodium, openssl
          coverage: none
          tools: wp-cli:2.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the rig downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/keelhob-rig
          key: rig-downloads-${{ hashFiles('tests/rig/build-rig.sh') }}
          restore-keys: rig-downloads-

      - name: Build the rig
        run: KH_RIG_CACHE="$HOME/.cache/keelhob-rig" bash tests/rig/build-rig.sh "$RUNNER_TEMP/rig"

      # playwright-core ships no browsers on purpose - a PHP plugin repo should
      # not carry 150MB of Chromium in its dev dependencies - so the browser is
      # installed separately here. The harness finds whatever is present.
      - name: Install the checker and a browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Serve the rig
        run: |
          cd "$RUNNER_TEMP/rig/wordpress"
          # Extra workers: WordPress makes loopback requests to itself, and a
          # single-worker built-in server deadlocks waiting for a response it is
          # not free to serve.
          PHP_CLI_SERVER_WORKERS=4 php -S localhost:8899 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8899/wp-login.php >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8899/wp-login.php >/dev/null

      - name: Run the browser checks
        run: |
          node tests/rig/ui/check-snippets.mjs \
            --wp http://localhost:8899 \
            --rig "$RUNNER_TEMP/rig/wordpress" \
            --user admin --pass rigpass | tee browser.log

      # The screenshots are the point of a failing run. A line saying "the
      # toggle was not visible" is much less useful than the picture of it not
      # being visible.
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            tests/rig/ui/failures/
            browser.log
          if-no-files-found: ignore

  package:
    name: Build the installable zip
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash bin/build-zip.sh

      - name: Verify the zip layout
        run: |
          set -euo pipefail
          # The archive must contain a single top-level keelhob/ directory,
          # or WordPress installs it to the wrong path.
          roots=$(unzip -Z1 build/keelhob.zip | cut -d/ -f1 | sort -u)
          if [ "$roots" != "keelhob" ]; then
            echo "::error::zip must contain exactly one top-level dir 'keelhob', got: $roots"
            exit 1
          fi
          # Nothing that shouldn't ship.
          if unzip -Z1 build/keelhob.zip | grep -Eq '(^|/)(\.git|\.github|tests|\.codegraph|node_modules)/'; then
            echo "::error::development files leaked into the zip"
            unzip -Z1 build/keelhob.zip | grep -E '(^|/)(\.git|\.github|tests|\.codegraph|node_modules)/'
            exit 1
          fi
          unzip -Z1 build/keelhob.zip | grep -q '^keelhob/keelhob.php$'
          echo "zip OK — $(unzip -Z1 build/keelhob.zip | wc -l) entries, $(du -h build/keelhob.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: keelhob-plugin
          path: build/keelhob.zip
          if-no-files-found: error

  smoke:
    name: Live MCP smoke test
    runs-on: ubuntu-latest
    # Only runs where a target site is configured, so forks and PRs skip it.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke-test the configured site
        env:
          KEELHOB_URL: ${{ secrets.KEELHOB_URL }}
          KEELHOB_TOKEN: ${{ secrets.KEELHOB_TOKEN }}
        run: |
          if [ -z "${KEELHOB_URL:-}" ]; then
            echo "No KEELHOB_URL secret set — skipping."
            exit 0
          fi
          node tests/live-smoke.mjs
